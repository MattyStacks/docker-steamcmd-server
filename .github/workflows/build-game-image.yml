# GitHub Actions Workflow: Build and Push Game Server Docker Images
# This workflow automatically builds Docker images for different game servers (based on branch names)
# and publishes them to both GitHub Container Registry (ghcr.io) and Docker Hub

name: Build and Push Game Server Image

on:
  # Trigger on push to any branch except master/main (game-specific branches like 'valheim', 'foundry', etc.)
  push:
    branches:
      - '*'        # All branches
      - '!master'  # Exclude master
      - '!main'    # Exclude main
  # Trigger on pull requests to any branch except master/main
  pull_request:
    branches:
      - '*'        # All branches
      - '!master'  # Exclude master
      - '!main'    # Exclude main
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

# Environment variables used throughout the workflow
env:
  GHCR_REGISTRY: ghcr.io                              # GitHub Container Registry
  DOCKERHUB_REGISTRY: docker.io                        # Docker Hub Registry
  IMAGE_NAME: ${{ github.repository_owner }}/steamcmd # Base image name

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # Use Ubuntu runner for Docker operations
    permissions:
      contents: read   # Read repository contents
      packages: write  # Write to GitHub Container Registry

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Extract the branch name (used as the game tag, e.g., 'valheim', 'foundry')
      - name: Extract branch name
        id: branch
        run: echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      # Step 3: Convert image name to lowercase (Docker registry requirement)
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository_owner }}/steamcmd' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Step 4: Authenticate to GitHub Container Registry (ghcr.io)
      # Uses built-in GITHUB_TOKEN for automatic authentication
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}              # GitHub username
          password: ${{ secrets.GITHUB_TOKEN }}      # Automatic GitHub token

      # Step 5: Authenticate to Docker Hub (docker.io)
      # Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to be configured in repository settings
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Docker Hub username (set in repo secrets)
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # Docker Hub access token (set in repo secrets)

      # Step 6: Generate Docker image metadata (tags, labels, annotations)
      # This creates tags for BOTH registries using the branch name as the image tag
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Target both registries - images will be tagged for both destinations
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ steps.image.outputs.name }}     # ghcr.io/owner/steamcmd
            ${{ env.DOCKERHUB_REGISTRY }}/${{ steps.image.outputs.name }} # docker.io/owner/steamcmd
          # Use branch name as the image tag (e.g., 'valheim', 'foundry')
          tags: |
            type=raw,value=${{ steps.branch.outputs.name }}
          # Add descriptive labels to the image
          labels: |
            org.opencontainers.image.description=A Docker image to run SteamCMD for dedicated game servers - ${{ steps.branch.outputs.name }} server
          # Add annotations with same description
          annotations: |
            org.opencontainers.image.description=A Docker image to run SteamCMD for dedicated game servers - ${{ steps.branch.outputs.name }} server

      # Step 7: Set up Docker Buildx (advanced Docker build tool with multi-platform support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 8: Build the Docker image and push to BOTH registries simultaneously
      # The action automatically detects multiple registries from the tags and pushes to all of them
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                                        # Build from current directory
          push: true                                        # Push to registries after build
          no-cache: true                                    # Don't use cache to ensure fresh build
          tags: ${{ steps.meta.outputs.tags }}              # Apply tags for both registries
          labels: ${{ steps.meta.outputs.labels }}          # Apply metadata labels
          annotations: ${{ steps.meta.outputs.labels }}     # Apply annotations
          cache-to: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.branch.outputs.name }}-buildcache,mode=max  # Store build cache in GHCR
